name: graphdone-selfhost
services:
  proxy:
    image: caddy:2-alpine
    ports: ["${HTTP_PORT:-80}:80", "${HTTPS_PORT:-443}:443"]
    environment:
      GRAPHDONE_ADDRESS: ${GRAPHDONE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  web:
    build:
      context: ../..
      dockerfile: deployment/self-host/Dockerfile
      target: web
    depends_on: [api]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  api:
    build:
      context: ../..
      dockerfile: deployment/self-host/Dockerfile
      target: api
    environment:
      NODE_ENV: production
      PORT: "4127"
      SSL_ENABLED: "false"
      NEO4J_URI: bolt://database:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Run scripts/self-host.sh first}
      JWT_SECRET: ${JWT_SECRET:?Run scripts/self-host.sh first}
      SESSION_SECRET: ${SESSION_SECRET:?Run scripts/self-host.sh first}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@graphdone.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run scripts/self-host.sh first}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CLIENT_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "2"
    volumes: [auth_data:/app/packages/server/data]
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  database:
    image: neo4j:5.26.12
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run scripts/self-host.sh first}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [graph_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$${NEO4J_AUTH#neo4j/}" "RETURN 1" >/dev/null']
      interval: 15s
      timeout: 10s
      retries: 20
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
volumes:
  auth_data:
  graph_data:
  caddy_data:
  caddy_config:

name: Release (disabled)

on:
  workflow_dispatch:

permissions: {}

jobs:
  unavailable:
    name: Release is not configured
    runs-on: ubuntu-latest
    steps:
      - name: Reject unimplemented release operation
        run: |
          echo "::error::Release is disabled. See docs/quality/RELEASE_GATES.md for the required validated-SHA release process."
          exit 1

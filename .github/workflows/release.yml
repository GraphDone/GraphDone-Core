name: Release

# Publishing a release: merge dev → main, wait for main's CI to go green, then
# tag that main merge commit (see docs/quality/RELEASE_GATES.md):
#   git tag -a v0.4.0-alpha <main sha> -m "GraphDone v0.4.0-alpha" && git push origin v0.4.0-alpha
# Only admins can create v* tags (repository tag ruleset). This workflow refuses
# to publish unless the tag is a commit main was at, whose main-push checks
# passed and whose package versions equal the tag.
# graphdone.com is deployed from GraphDone-Cloud, not from this repository.

on:
  push:
    tags: ['v*.*.*']

permissions: {}

# One run per tag; never cancel a release that has started publishing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify validated source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require a main commit with passing main-push checks and matching versions
        id: gate
        run: node scripts/verify-release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Each architecture builds natively on its own runner and pushes by digest
  # only (no tag). QEMU emulation is not used: emulated arm64 `npm ci` crashed
  # with "Illegal instruction" in the v0.4.0-alpha release run.
  images:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [web, api, neo4j]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          # Build arguments match the stack the production gate validated
          # (deployment/docker-compose.yml).
          - image: web
            dockerfile: packages/web/Dockerfile
            build-args: |
              VITE_GRAPHQL_URL=https://localhost:3128/api/graphql
              VITE_GRAPHQL_WS_URL=wss://localhost:3128/api/graphql
          - image: api
            dockerfile: packages/server/Dockerfile
            build-args: ''
          - image: neo4j
            dockerfile: deployment/neo4j.Dockerfile
            build-args: ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push linux/${{ matrix.arch }} by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/graphdone/graphdone-${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.verify.outputs.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=MIT
      - name: Record platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          echo "$DIGEST" > "digests/${{ matrix.image }}-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error

  # Join both architectures into the version tag. Only the version tag here;
  # `latest` moves for all images together in github-release.
  manifests:
    name: Publish ${{ matrix.image }} ${{ needs.verify.outputs.version }}
    needs: [verify, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image: [web, api, neo4j]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Create the multi-architecture version tag
        env:
          IMAGE: ghcr.io/graphdone/graphdone-${{ matrix.image }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          refs=()
          for file in digests/*; do refs+=("$IMAGE@$(cat "$file")"); done
          [ "${#refs[@]}" -eq 2 ] || { echo "::error::expected 2 platform digests, found ${#refs[@]}"; exit 1; }
          docker buildx imagetools create -t "$IMAGE:$VERSION" "${refs[@]}"
          manifest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}')
          platforms=$(echo "$manifest" | jq -r '[.manifests[].platform | select(.os != "unknown") | "\(.os)/\(.architecture)"] | sort | join(",")')
          [ "$platforms" = "linux/amd64,linux/arm64" ] || { echo "::error::$IMAGE:$VERSION has platforms '$platforms'"; exit 1; }
          mkdir -p published
          echo "$IMAGE@$(echo "$manifest" | jq -r .digest)" > "published/${{ matrix.image }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.image }}
          path: published/
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs: [verify, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Decided now, from published releases, so a re-run cannot reuse a stale
      # answer and move `latest` back to an older version.
      - name: Decide whether this release becomes latest
        id: latest
        run: node scripts/verify-release.mjs --latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: docker/login-action@v3
        if: steps.latest.outputs.latest == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Move latest on all images together
        if: steps.latest.outputs.latest == 'true'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          for image in web api neo4j; do
            docker buildx imagetools create -t "ghcr.io/graphdone/graphdone-$image:latest" "ghcr.io/graphdone/graphdone-$image:$VERSION"
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: published
      - name: Publish release notes with image digests
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ needs.verify.outputs.sha }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          {
            echo "Source: \`$SHA\`"
            echo
            echo "**Container images** (linux/amd64 + linux/arm64, with SBOM and provenance):"
            echo
            for f in published/*.txt; do echo "- \`$(cat "$f")\`"; done
            echo
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "GraphDone $TAG" --notes-file notes.md --generate-notes \
            --latest="$LATEST"

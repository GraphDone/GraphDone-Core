name: Deploy (disabled)

on:
  workflow_dispatch:

permissions: {}

jobs:
  unavailable:
    name: Deploy is not configured
    runs-on: ubuntu-latest
    steps:
      - name: Reject unimplemented deploy operation
        run: |
          echo "::error::Deploy is disabled. See docs/quality/RELEASE_GATES.md for the required validated-SHA release process."
          exit 1

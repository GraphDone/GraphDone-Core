name: Docker Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same native per-architecture builds the release runs (no QEMU
  # emulation), without registry writes.
  build:
    name: Build ${{ matrix.image }} (${{ matrix.arch }}, no publication)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: [web, api, neo4j]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: web
            dockerfile: packages/web/Dockerfile
          - image: api
            dockerfile: packages/server/Dockerfile
          - image: neo4j
            dockerfile: deployment/neo4j.Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Validate linux/${{ matrix.arch }} without registry writes
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

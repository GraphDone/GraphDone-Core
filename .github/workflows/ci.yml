name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly full prod-stack smoke
  workflow_dispatch:

# Prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Static quality: lint (0 errors) + full TypeScript type check ───────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: ESLint (fails only on errors)
        run: npm run lint
      - name: TypeScript type check (all packages)
        run: npm run typecheck
      - name: Test evidence and runner regressions
        run: npm run test:unified:lib
      - name: Repository root allowlist and public-content guard
        run: node --test tests/toolchain/repo-root-contract.mjs tests/toolchain/public-content-contract.mjs tests/toolchain/version-contract.mjs
      - name: Schematic routing visual gate
        run: |
          npm run report:schematic -- --out test-artifacts/ci-schematic-routing
          npm run test:schematic
      - name: Retain schematic fixtures and geometry metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schematic-routing-${{ github.sha }}
          path: test-artifacts/ci-schematic-routing/
          if-no-files-found: error

  # ── The real unit suites, one job per package, run in parallel ─────────────
  unit-tests:
    name: Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, web, server, mcp-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run @graphdone/${{ matrix.package }} tests
        run: npm run build --workspace=@graphdone/core && npm run test --workspace=@graphdone/${{ matrix.package }}

  # ── MCP server against a REAL Neo4j (catches Cypher/DB drift) ──────────────
  # The unit suites use a mock driver; this runs the MCP GraphService's own
  # Cypher against a live Neo4j (node/edge lifecycle, browse). It already
  # caught a real getNodeDetails crash the mock hid.
  mcp-contract:
    name: MCP Real-Neo4j Contract
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_password
          NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
          NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7474:7474
          - 7687:7687
    env:
      RUN_DB_CONTRACT: '1'
      GRAPHDONE_DISPOSABLE_NEO4J: '1'
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run real-Neo4j contract test
        run: npx vitest --run tests/neo4j-contract.test.ts
        working-directory: packages/mcp-server

  # ── Production build must actually build ────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build all packages
        run: npm run build
      - name: Bundle size budget (ADAPT-8)
        run: npm run perf:bundle

  # ── Production dependency security gate ───────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Reject high and critical production dependency advisories
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/graphdone-audit-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm audit --omit=dev --audit-level=high

  # ── THE GATE: the app works from a user's point of view ────────────────────
  # Fast feedback on every PR: boots the dev stack against a Neo4j service
  # container and runs the user-smoke suite (login → nodes AND edges render →
  # no GraphQL errors → no orphan edges → grow + undo work). ~3-4 min vs the
  # ~45 min cold prod-image build, so it's a gate people actually keep green.
  # The Smoke Gate's sequences run as four parallel shards, each on its own
  # GitHub-hosted VM with its own Neo4j and dev stack (the single job took
  # ~42 min; the slowest shard is ~14 min plus setup). Each line of
  # `sequences` is "<sequence> <output dir> [xvfb]"; "living-graph-effects" is
  # the LIVE-* Playwright spec. Every shard starts with THE GATE (smoke), as
  # the single job did, so later sequences never meet a cold database or a
  # first sign-in. Sequences keep the single job's order. A shard runs all its
  # sequences and fails if any failed. The "Smoke Gate" job below sums the
  # shards up under the old name.
  smoke-gate-shard:
    name: Smoke Gate (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: new user
            sequences: |
              smoke ci-smoke
              new-user ci-new-user xvfb
          - name: 2000 items, nested LOD, routes, mobile
            sequences: |
              smoke ci-smoke
              large-symbols ci-large-symbols
              nested-lod ci-nested-lod xvfb
              router-navigation ci-router-navigation xvfb
              mobile ci-mobile
          - name: wires, agents, inspector, effects, perf
            sequences: |
              smoke ci-smoke
              item-wires ci-item-wires xvfb
              agent-connection ci-agent-connection xvfb
              inspector-readability ci-inspector-readability xvfb
              living-graph-effects - -
              perf-budgets ci-perf
          - name: toolchain, schematic, LOD, layout
            toolchain: true
            sequences: |
              smoke ci-smoke
              semantic-lod ci-semantic-lod xvfb
              layout-recovery ci-layout-recovery xvfb
              example-resume ci-example-resume
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_password
          NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
          NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7474:7474
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_password
      JWT_SECRET: ci-smoke-jwt-secret
      SESSION_SECRET: ci-smoke-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build (dev runtime imports built @graphdone/core)
        run: npm run build
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Vite proxy, hot reload and offline-shell contract
        if: matrix.toolchain
        run: npm run test:toolchain
      - name: Schematic fixture visual acceptance
        if: matrix.toolchain
        run: node tests/run-unified.mjs --sequence schematic-visual --out test-artifacts/ci-schematic-visual
      - name: Start GraphDone (dev stack)
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          echo "Waiting for web (3127) and API (4127) to come up..."
          timeout 240 bash -c 'until curl -sf http://localhost:3127 >/dev/null 2>&1 && curl -sf http://localhost:4127/health >/dev/null 2>&1; do sleep 3; done'
          echo "Dev stack healthy."
      - name: Seed demo data
        run: npm run db:seed
      - name: Run this shard's sequences
        env:
          TEST_URL: http://localhost:3127
          CI: true
          SEQUENCES: ${{ matrix.sequences }}
        run: |
          failed=()
          while read -r sequence out display; do
            [[ -z "$sequence" ]] && continue
            echo "::group::$sequence"
            if [[ "$sequence" == living-graph-effects ]]; then
              cmd=(npx playwright test tests/e2e/graph/living-graph-effects.spec.ts --project="GraphDone-Core/dev-neo4j/chromium" --reporter=line)
            else
              cmd=(node tests/run-unified.mjs --sequence "$sequence" --out "test-artifacts/$out")
              [[ "$display" == xvfb ]] && cmd=(xvfb-run --auto-servernum "${cmd[@]}")
            fi
            "${cmd[@]}" < /dev/null || failed+=("$sequence")  # keep the loop's stdin
            echo "::endgroup::"
          done <<< "$SEQUENCES"
          if (( ${#failed[@]} )); then
            for sequence in "${failed[@]}"; do echo "::error title=Smoke Gate::$sequence failed"; done
            exit 1
          fi
          echo "All sequences in this shard passed."
      - name: Dump dev log on failure
        if: failure()
        run: tail -100 /tmp/dev.log || true
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.sha }}-${{ strategy.job-index }}
          path: |
            test-results/
            test-artifacts/
          retention-days: 7

  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    needs: [smoke-gate-shard]
    if: always()
    steps:
      - name: Every shard passed
        run: |
          echo "Shards: ${{ needs.smoke-gate-shard.result }}"
          [[ "${{ needs.smoke-gate-shard.result }}" == "success" ]] || { echo "A Smoke Gate shard did not pass; see the 'Smoke Gate (...)' jobs."; exit 1; }

  # ── UI fit: every screen on iPhone, iPad and desktop Chrome/Safari ─────────
  # Measures every visible control on every screen in tests/devices/screens.ts
  # on real device profiles (WebKit for Apple devices): accessible name,
  # pointer-only clickables, centre hit, label fit and contrast against the
  # pixels the browser drew, icon centring from pixels, vector icons, target
  # size and sideways scroll. Read-only, so it runs four at a time. The
  # annotated gallery is uploaded as the `ui-fit` artifact (index.html).
  device-fit:
    name: UI Fit (iPhone, iPad, desktop)
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, build]
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_password
          NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
          NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7474:7474
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_password
      JWT_SECRET: ci-ui-fit-jwt-secret
      SESSION_SECRET: ci-ui-fit-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build (dev runtime imports built @graphdone/core)
        run: npm run build
      - name: Install Playwright (Chromium for desktop Chrome, WebKit for Safari, iPhone and iPad)
        run: npx playwright install --with-deps chromium webkit
      - name: Start GraphDone (dev stack)
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          timeout 240 bash -c 'until curl -sf http://localhost:3127 >/dev/null 2>&1 && curl -sf http://localhost:4127/health >/dev/null 2>&1; do sleep 3; done'
      - name: Seed demo data
        run: npm run db:seed
      - name: UI fit on every device
        run: node tests/run-unified.mjs --sequence devices --out test-artifacts/ci-devices
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: Build the UI fit gallery
        if: always()
        run: |
          node tests/lib/ui-fit/report.mjs test-artifacts/ui-fit || true
          [ -f test-artifacts/ui-fit/summary.md ] && cat test-artifacts/ui-fit/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Dump dev log on failure
        if: failure()
        run: tail -100 /tmp/dev.log || true
      - name: Upload the UI fit gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-fit
          path: |
            test-artifacts/ui-fit/
            test-artifacts/ci-devices/
          retention-days: 14

  # ── Showcase report: .webm video + screenshots of every mode, all sizes ────
  # Documentation, not a gate (not in ci-success). Runs on every PR per the
  # team's choice; uploads a single self-contained gallery as an artifact.
  showcase-report:
    name: Showcase Report (video + screenshots)
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, build]
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_password
          NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
          NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7474:7474
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_password
      JWT_SECRET: ci-showcase-jwt-secret
      SESSION_SECRET: ci-showcase-session-secret
      TEST_URL: http://localhost:3127
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Start GraphDone (dev stack)
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          timeout 240 bash -c 'until curl -sf http://localhost:3127 >/dev/null 2>&1 && curl -sf http://localhost:4127/health >/dev/null 2>&1; do sleep 3; done'
      - name: Seed demo data
        run: npm run db:seed || true
      - name: Capture showcase + build gallery
        run: npm run report:showcase
        continue-on-error: true
      - name: Upload showcase gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-report-${{ github.sha }}
          path: test-artifacts/showcase/
          retention-days: 14

  prod-smoke:
    name: Prod Stack Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [quality, unit-tests, build]
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Validate owned production stack and persistent authentication
        run: xvfb-run --auto-servernum node scripts/test-production-stack.mjs --out test-artifacts/ci-prod-stack
        env:
          CI: true
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-results-${{ github.sha }}
          path: |
            test-artifacts/ci-prod-stack/run-*/report.json
            test-artifacts/ci-prod-stack/run-*/*.log
          if-no-files-found: error
          retention-days: 7

  runtime-images:
    name: Runtime Images (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: packages/server/Dockerfile
            target: runner
            uid: '0'
          - name: generic
            dockerfile: deployment/Dockerfile
            target: runner
            uid: '1001'
          - name: self-host
            dockerfile: deployment/self-host/Dockerfile
            target: api
            uid: '1000'
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_runtime_fixture
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_runtime_fixture 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7687:7687
    env:
      GRAPHDONE_DISPOSABLE_NEO4J: '1'
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_runtime_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the final runtime image
        run: |
          mkdir -p test-artifacts/runtime
          docker build --pull --target '${{ matrix.target }}' -f '${{ matrix.dockerfile }}' --iidfile test-artifacts/runtime/image-id .
      - name: Verify installed packages, production startup, API, MCP and volume recovery
        shell: bash
        run: node tests/runtime/run-image.mjs "$(cat test-artifacts/runtime/image-id)" '${{ matrix.uid }}' | tee test-artifacts/runtime/contract.jsonl
      - name: Record final image OS and npm inventory
        shell: bash
        run: |
          docker save "$(cat test-artifacts/runtime/image-id)" -o "$RUNNER_TEMP/runtime-image.tar"
          mkdir -p "$RUNNER_TEMP/runtime-trivy-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$RUNNER_TEMP/runtime-image.tar,target=/image.tar,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/runtime-trivy-cache,target=/cache" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /image.tar --cache-dir /cache --scanners vuln --list-all-pkgs --format json \
            > test-artifacts/runtime/trivy.json
          cp "$RUNNER_TEMP/runtime-trivy-cache/db/metadata.json" test-artifacts/runtime/trivy-db.json
          node tests/runtime/check-scan.mjs test-artifacts/runtime/trivy.json
      - name: Retain image provenance and contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-${{ matrix.name }}-${{ github.sha }}
          path: test-artifacts/runtime/
          retention-days: 7

  # ── Overall status ─────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, mcp-contract, build, security-scan, smoke-gate, device-fit, prod-smoke, runtime-images]
    if: always()
    steps:
      - name: Verify required jobs passed
        env:
          PROD_REQUIRED: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$PROD_REQUIRED" == "true" ]]; then
            [[ "${{ needs.prod-smoke.result }}" == "success" ]] || { echo "Required production gate did not pass"; exit 1; }
          else
            [[ "${{ needs.prod-smoke.result }}" == "skipped" ]] || { echo "Unexpected production gate state"; exit 1; }
          fi
          echo "Production: ${{ needs.prod-smoke.result }} (required=$PROD_REQUIRED)"
          echo "Quality:    ${{ needs.quality.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Build:      ${{ needs.build.result }}"
          echo "Smoke gate: ${{ needs.smoke-gate.result }}"
          echo "UI fit:     ${{ needs.device-fit.result }}"
          if [[ "${{ needs.quality.result }}" == "success" \
             && "${{ needs.unit-tests.result }}" == "success" \
             && "${{ needs.mcp-contract.result }}" == "success" \
             && "${{ needs.build.result }}" == "success" \
             && "${{ needs.security-scan.result }}" == "success" \
             && "${{ needs.smoke-gate.result }}" == "success" \
             && "${{ needs.device-fit.result }}" == "success" \
             && "${{ needs.runtime-images.result }}" == "success" ]]; then
            echo "✅ CI green — lint, types, every unit suite, the build, the user smoke gate and the UI fit matrix all passed."
          else
            echo "❌ CI failed — see the failing job above."
            exit 1
          fi

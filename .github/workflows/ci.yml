name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: '0 3 * * *'   # nightly full prod-stack smoke
  workflow_dispatch:

# Prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Static quality: lint (0 errors) + full TypeScript type check ───────────
  quality:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: ESLint (fails only on errors)
        run: npm run lint
      - name: TypeScript type check (all packages)
        run: npm run typecheck
      - name: Test evidence and runner regressions
        run: npm run test:unified:lib

  # ── The real unit suites, one job per package, run in parallel ─────────────
  unit-tests:
    name: Unit Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, web, server, mcp-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run @graphdone/${{ matrix.package }} tests
        run: npm run build --workspace=@graphdone/core && npm run test --workspace=@graphdone/${{ matrix.package }}

  # ── MCP server against a REAL Neo4j (catches Cypher/DB drift) ──────────────
  # The unit suites use a mock driver; this runs the MCP GraphService's own
  # Cypher against a live Neo4j (node/edge lifecycle, browse). It already
  # caught a real getNodeDetails crash the mock hid.
  mcp-contract:
    name: MCP Real-Neo4j Contract
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_password
          NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
          NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7474:7474
          - 7687:7687
    env:
      RUN_DB_CONTRACT: '1'
      GRAPHDONE_DISPOSABLE_NEO4J: '1'
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run real-Neo4j contract test
        run: npx vitest --run tests/neo4j-contract.test.ts
        working-directory: packages/mcp-server

  # ── Production build must actually build ────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build all packages
        run: npm run build
      - name: Bundle size budget (ADAPT-8)
        run: npm run perf:bundle

  # ── Production dependency security gate ───────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Reject high and critical production dependency advisories
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/graphdone-audit-${{ github.run_id }}-${{ github.run_attempt }}
        run: npm audit --omit=dev --audit-level=high

  # ── THE GATE: the app works from a user's point of view ────────────────────
  # Fast feedback on every PR: boots the dev stack against a Neo4j service
  # container and runs the user-smoke suite (login → nodes AND edges render →
  # no GraphQL errors → no orphan edges → grow + undo work). ~3-4 min vs the
  # ~45 min cold prod-image build, so it's a gate people actually keep green.
  smoke-gate:
    name: Smoke Gate
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, build]
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_password
          NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
          NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7474:7474
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_password
      JWT_SECRET: ci-smoke-jwt-secret
      SESSION_SECRET: ci-smoke-session-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build (dev runtime imports built @graphdone/core)
        run: npm run build
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Vite proxy, hot reload and offline-shell contract
        run: npm run test:toolchain
      - name: Start GraphDone (dev stack)
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          echo "Waiting for web (3127) and API (4127) to come up..."
          timeout 240 bash -c 'until curl -sf http://localhost:3127 >/dev/null 2>&1 && curl -sf http://localhost:4127/health >/dev/null 2>&1; do sleep 3; done'
          echo "Dev stack healthy."
      - name: Seed demo data
        run: npm run db:seed
      - name: THE GATE — user smoke suite
        run: node tests/run-unified.mjs --sequence smoke --out test-artifacts/ci-smoke
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: New-user quality gate (headed under virtual display)
        run: xvfb-run --auto-servernum node tests/run-unified.mjs --sequence new-user --out test-artifacts/ci-new-user
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: Semantic LOD acceptance
        run: xvfb-run --auto-servernum node tests/run-unified.mjs --sequence semantic-lod --out test-artifacts/ci-semantic-lod
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: Durable layout recovery acceptance
        run: xvfb-run --auto-servernum node tests/run-unified.mjs --sequence layout-recovery --out test-artifacts/ci-layout-recovery
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: Route compatibility acceptance
        run: xvfb-run --auto-servernum node tests/run-unified.mjs --sequence router-navigation --out test-artifacts/ci-router-navigation
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: Mobile UI audit (layout / contrast / dialogs across every screen)
        run: node tests/run-unified.mjs --sequence mobile --out test-artifacts/ci-mobile
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: Living-graph effects render (LIVE-*)
        run: npx playwright test tests/e2e/graph/living-graph-effects.spec.ts --project="GraphDone-Core/dev-neo4j/chromium" --reporter=line
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: Performance budgets (ADAPT-8)
        run: node tests/run-unified.mjs --sequence perf-budgets --out test-artifacts/ci-perf
        env:
          TEST_URL: http://localhost:3127
          CI: true
      - name: Dump dev log on failure
        if: failure()
        run: tail -100 /tmp/dev.log || true
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.sha }}
          path: |
            test-results/
            test-artifacts/
          retention-days: 7

  # ── Showcase report: .webm video + screenshots of every mode, all sizes ────
  # Documentation, not a gate (not in ci-success). Runs on every PR per the
  # team's choice; uploads a single self-contained gallery as an artifact.
  showcase-report:
    name: Showcase Report (video + screenshots)
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, build]
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_password
          NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
          NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_password 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7474:7474
          - 7687:7687
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_password
      JWT_SECRET: ci-showcase-jwt-secret
      SESSION_SECRET: ci-showcase-session-secret
      TEST_URL: http://localhost:3127
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Start GraphDone (dev stack)
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          timeout 240 bash -c 'until curl -sf http://localhost:3127 >/dev/null 2>&1 && curl -sf http://localhost:4127/health >/dev/null 2>&1; do sleep 3; done'
      - name: Seed demo data
        run: npm run db:seed || true
      - name: Capture showcase + build gallery
        run: npm run report:showcase
        continue-on-error: true
      - name: Upload showcase gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: showcase-report-${{ github.sha }}
          path: test-artifacts/showcase/
          retention-days: 14

  # ── Full production-stack validation (nginx/TLS/Docker) ─────────────────────
  # Heavy (~45 min cold build), so it runs only on main pushes, the nightly
  # schedule, and manual dispatch — not on every PR. Same user-smoke suite,
  # plus the broader PR suite as advisory signal, against the real prod stack.
  prod-smoke:
    name: Prod Stack Smoke (main / nightly)
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium
      - name: Generate development certificates
        run: ./scripts/generate-dev-certs.sh
      - name: Start GraphDone (production stack)
        run: |
          export JWT_SECRET="$(openssl rand -hex 32)"
          export SESSION_SECRET="$(openssl rand -hex 32)"
          npm run docker:prod &
          echo "Waiting for the stack to be healthy (cold image build can take minutes)..."
          timeout 1200 bash -c 'until curl -k https://localhost:3128/health 2>/dev/null; do sleep 5; done'
          echo "Stack healthy."
      - name: Seed demo data
        run: npm run db:seed || echo "seed skipped/failed — smoke still validates the stack"
        continue-on-error: true
      - name: THE GATE — user smoke suite (prod stack)
        run: npm run test:smoke
        env:
          TEST_URL: https://localhost:3128
          CI: true
      - name: PR critical suite (advisory)
        run: npm run test:pr || echo "::warning::PR critical suite has known failures — tracked in docs/TESTING_AND_REFINEMENT_PLAN.md"
        continue-on-error: true
        env:
          TEST_URL: https://localhost:3128
          TEST_ENV: production
          CI: true
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-smoke-results-${{ github.sha }}
          path: |
            test-results/
            test-artifacts/
          retention-days: 7

  runtime-images:
    name: Runtime Images (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: packages/server/Dockerfile
            target: runner
            uid: '0'
          - name: generic
            dockerfile: deployment/Dockerfile
            target: runner
            uid: '1001'
          - name: self-host
            dockerfile: deployment/self-host/Dockerfile
            target: api
            uid: '1000'
    services:
      neo4j:
        image: neo4j:5.26.12
        env:
          NEO4J_AUTH: neo4j/graphdone_runtime_fixture
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphdone_runtime_fixture 'RETURN 1'"
          --health-interval 10s --health-timeout 5s --health-retries 30
        ports:
          - 7687:7687
    env:
      GRAPHDONE_DISPOSABLE_NEO4J: '1'
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: graphdone_runtime_fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build the final runtime image
        run: |
          mkdir -p test-artifacts/runtime
          docker build --pull --target '${{ matrix.target }}' -f '${{ matrix.dockerfile }}' --iidfile test-artifacts/runtime/image-id .
      - name: Verify installed packages, production startup, API, MCP and volume recovery
        shell: bash
        run: node tests/runtime/run-image.mjs "$(cat test-artifacts/runtime/image-id)" '${{ matrix.uid }}' | tee test-artifacts/runtime/contract.jsonl
      - name: Record final image OS and npm inventory
        shell: bash
        run: |
          docker save "$(cat test-artifacts/runtime/image-id)" -o "$RUNNER_TEMP/runtime-image.tar"
          mkdir -p "$RUNNER_TEMP/runtime-trivy-cache"
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$RUNNER_TEMP/runtime-image.tar,target=/image.tar,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/runtime-trivy-cache,target=/cache" \
            aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --input /image.tar --cache-dir /cache --scanners vuln --list-all-pkgs --format json \
            > test-artifacts/runtime/trivy.json
          cp "$RUNNER_TEMP/runtime-trivy-cache/db/metadata.json" test-artifacts/runtime/trivy-db.json
          node tests/runtime/check-scan.mjs test-artifacts/runtime/trivy.json
      - name: Retain image provenance and contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-image-${{ matrix.name }}-${{ github.sha }}
          path: test-artifacts/runtime/
          retention-days: 7

  # ── Overall status ─────────────────────────────────────────────────────────
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, mcp-contract, build, security-scan, smoke-gate, runtime-images]
    if: always()
    steps:
      - name: Verify required jobs passed
        run: |
          echo "Quality:    ${{ needs.quality.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Build:      ${{ needs.build.result }}"
          echo "Smoke gate: ${{ needs.smoke-gate.result }}"
          if [[ "${{ needs.quality.result }}" == "success" \
             && "${{ needs.unit-tests.result }}" == "success" \
             && "${{ needs.mcp-contract.result }}" == "success" \
             && "${{ needs.build.result }}" == "success" \
             && "${{ needs.security-scan.result }}" == "success" \
             && "${{ needs.smoke-gate.result }}" == "success" \
             && "${{ needs.runtime-images.result }}" == "success" ]]; then
            echo "✅ CI green — lint, types, every unit suite, the build, and the user smoke gate all passed."
          else
            echo "❌ CI failed — see the failing job above."
            exit 1
          fi

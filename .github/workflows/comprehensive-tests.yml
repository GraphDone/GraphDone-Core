name: Comprehensive Test Suite

# Complements ci.yml (Node 22 + full-stack smoke gate) by proving the real
# unit suites also pass on the minimum supported Node version, and by
# validating the installer + deployment config. Runs daily so flakes and
# dependency drift surface even without a push.

on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    - cron: '0 2 * * *'   # daily 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Real unit suites across the supported Node range (engines: >=22.18)
  unit-matrix:
    name: Unit Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.18.0', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Run all unit suites (core, web, server, mcp-server)
        run: npm run test:coverage && npm run test:unified:lib

  # Genuinely-real checks: the installer installs a ref that exists and can
  # fetch its code, and the deployment compose files parse
  installer-and-deploy-config:
    name: Installer & Deploy Config
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Installer ref and image-tag contract
        run: node --test tests/toolchain/installer-contract.mjs
      - name: Installer end to end in a container (clone, update, setup-script URLs)
        run: sh tests/integration/installer-container.sh
      - name: Installation script present and executable
        run: |
          test -f scripts/install.sh || { echo "::error::scripts/install.sh missing"; exit 1; }
          test -x scripts/install.sh || echo "::warning::scripts/install.sh is not marked executable"
          echo "✅ installer present"
      - name: Production docker compose config is valid
        run: |
          for file in deployment/docker-compose.yml deployment/docker-compose.registry.yml; do
            docker compose -f "$file" config > /dev/null \
              && echo "✅ $file is valid" \
              || { echo "::error::$file failed to parse"; exit 1; }
          done

  # Honest PR comment derived from real job outcomes (no fabricated numbers)
  report:
    name: Report
    runs-on: ubuntu-latest
    needs: [unit-matrix, installer-and-deploy-config]
    if: always() && github.event_name == 'pull_request'
    steps:
      - name: Comment PR with real results
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const unit = '${{ needs.unit-matrix.result }}';
            const cfg = '${{ needs.installer-and-deploy-config.result }}';
            const mark = (r) => r === 'success' ? '✅ passed' : (r === 'skipped' ? '⏭️ skipped' : '❌ ' + r);
            const body = [
              '## 🧪 Comprehensive Test Suite',
              '',
              `- **Unit suites (Node 22.18.0 & 24.x)** — core, web, server, mcp-server: ${mark(unit)}`,
              `- **Installer & deploy config**: ${mark(cfg)}`,
              '',
              '_Full-stack smoke gate runs in the **CI** workflow._',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
